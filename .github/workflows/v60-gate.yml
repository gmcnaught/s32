name: V60 gate

# Every stage of the V60 cycle-accuracy stack is gated on these benches.  The
# tree's own runner (verif/v60/run_v60_verilator.sh) needs verilator-safe and
# verilator-sim-safe wrappers that only exist on the maintainer's machine, so
# CI runs the Icarus mirror: same testbench list, same PASS markers.
#
# Quartus is not involved.  Bitstream fit and timing closure stay a manual
# step -- this job only proves the RTL still means what the benches say.

# `pull_request` alone covers the stack: every stage branch has a PR against
# its parent.  Listing the stage branches under `push` as well ran the whole
# gate twice per commit and left a duplicate check row in each PR -- one
# passing, one still pending -- which makes a green PR look unfinished.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: v60-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v60-unit:
    name: V60 unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V | head -1
      - name: V60 unit benches
        run: bash verif/v60/run_v60_icarus.sh

  cosim:
    name: Differential co-sim (50 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V60 vs independent Python reference
        run: sh verif/cosim/run_diff.sh 50

  constraints:
    name: SDC premise vs RTL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No simulator can catch this: it is a property of the timing
      # constraints, not of the RTL.
      - name: s32.sdc two-cycle exception covers only ce-gated registers
        run: python3 verif/timing/check_v60_ce_premise.py

  core:
    name: Full-core lint / boot / soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
      - name: Core benches, both build profiles
        run: bash verif/run_core_gate.sh
